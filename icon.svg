<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Background Grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="80" y1="352" x2="432" y2="352" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
  
  <!-- Forecast Cone -->
  <path d="M 280 260 L 430 140 L 430 330 Z" fill="url(#coneGrad)" />
  
  <!-- Candlesticks (Historical) -->
  <!-- Candle 1 (Green) -->
  <line x1="120" y1="280" x2="120" y2="390" stroke="#10b981" stroke-width="4" />
  <rect x="110" y="300" width="20" height="70" rx="4" fill="#10b981" />

  <!-- Candle 2 (Red) -->
  <line x1="170" y1="240" x2="170" y2="360" stroke="#ef4444" stroke-width="4" />
  <rect x="160" y="270" width="20" height="60" rx="4" fill="#ef4444" />

  <!-- Candle 3 (Green) -->
  <line x1="220" y1="200" x2="220" y2="320" stroke="#10b981" stroke-width="4" />
  <rect x="210" y="220" width="20" height="70" rx="4" fill="#10b981" />

  <!-- Candle 4 (Green) -->
  <line x1="270" y1="180" x2="270" y2="290" stroke="#10b981" stroke-width="4" />
  <rect x="260" y="190" width="20" height="80" rx="4" fill="#10b981" />

  <!-- Forecast Projected Path -->
  <path d="M 270 230 Q 340 180 430 160" fill="none" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8" />
  <circle cx="430" cy="160" r="8" fill="#10b981" />
  <circle cx="430" cy="160" r="14" fill="#10b981" fill-opacity="0.3" />
</svg>
